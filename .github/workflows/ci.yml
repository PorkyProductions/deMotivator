name: CI

on:
  push:
    branches: [dev, Stable]
  pull_request:
    branches: [dev, Stable]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      # NOTE: PorkyBot (porkybot.yml) depends on these exact step names
      # to extract check results. If you rename them, update porkybot.yml too.
      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run typeCheck

      - name: Build
        run: npm run build
